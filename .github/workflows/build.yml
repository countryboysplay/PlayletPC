name: build

# Every push and PR is verified. An installer is attached to a release only when
# you push a version tag, so publishing stays a deliberate act.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # src-tauri is its own cargo workspace, so point the cache at it.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # package.json is the one version (tauri.conf.json points at it). Cargo.toml and
      # a release tag must agree, or the updater would compare the wrong numbers.
      - name: Versions match
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          grep -q "^version = \"$v\"$" src-tauri/Cargo.toml || { echo "Cargo.toml version is not $v"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1
          fi

      - name: Typecheck
        run: npm run check

      # Offline fixture assertions only. `npm run test:live` hits YouTube and would
      # make CI fail for reasons that have nothing to do with the commit.
      - name: Test (offline assertions)
        run: npm test

      - name: Test (Rust)
        run: cargo test --bin playlet-desktop
        working-directory: src-tauri

      - name: Build NSIS installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run desktop:build:nsis

      # Tag builds also sign the installer for the updater (*-setup.exe.sig).
      - name: Build signed NSIS installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm run desktop:build:nsis -- --config '{"bundle":{"createUpdaterArtifacts":true}}'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # What the installed app's updater reads, via releases/latest/download/latest.json.
      - name: Write latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd src-tauri/target/release/bundle/nsis
          exe=$(ls *-setup.exe)
          node -e '
            const fs = require("fs"), [exe, tag, repo] = process.argv.slice(1)
            fs.writeFileSync("latest.json", JSON.stringify({
              version: tag.slice(1),
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": {
                signature: fs.readFileSync(exe + ".sig", "utf8"),
                url: `https://github.com/${repo}/releases/download/${tag}/${exe}`
              } }
            }, null, 2))' "$exe" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
          cat latest.json

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: playlet-windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      # Tag pushes only, and published: installed apps update from the latest
      # published release, so pushing a v* tag is the deliberate act.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          make_latest: true
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
          body: |
            Unsigned build — SmartScreen warns once (*More info → Run anyway*).
            Per-user install to `%LOCALAPPDATA%\Playlet`, no admin required.
            Installed copies update themselves: Playlet offers to restart when no video is open.

            Full-length playback at up to 2160p, browsing, search, channels,
            playlists, subscriptions and SponsorBlock all work.
