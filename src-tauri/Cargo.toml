[package]
name = "playlet-desktop"
version = "0.1.0"
description = "Playlet Desktop - Invidious client for Windows"
authors = ["Playlet Desktop"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# HTTP: we mainly use the plugin's re-exported reqwest from our OWN Rust commands
# (scope checks do NOT apply to reqwest used inside a #[tauri::command], only to
# the JS `fetch` the plugin exposes -- that is exactly why the JS side stays locked).
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Power"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# NOTE: intentionally NOT setting `panic = "abort"`. Tauri/wry unwind across the
# webview callback boundary in a few paths; abort turns a recoverable command
# panic into a hard process kill with no crash dialog.
